name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  strict-checks:
    name: Strict Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0" # Sesuaikan dengan rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            monumentum_db
            monumentum_query

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with strict lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build (debug)
        run: cargo build --workspace --all-targets --all-features

      - name: Run all tests
        run: cargo test --workspace --all-targets --all-features

      - name: Build (release) to catch optimization issues
        run: cargo build --workspace --all-targets --all-features --release

      - name: Check documentation (optional)
        run: cargo doc --workspace --no-deps --document-private-items
